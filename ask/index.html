<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask Ishpreet Singh</title>
  <style>
    :root { --primary: #4f46e5; --dark: #0f172a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, var(--dark) 0%, #312e81 100%);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff; border-radius: 22px;
      width: 100%; max-width: 480px;
      box-shadow: 0 24px 64px rgba(2,6,23,0.35);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, var(--dark), #312e81);
      color: #fff; padding: 28px 24px; text-align: center;
    }
    .avatar {
      width: 64px; height: 64px; border-radius: 50%;
      background: #4f46e5; display: flex; align-items: center;
      justify-content: center; font-size: 2rem;
      margin: 0 auto 14px; border: 3px solid #c7d2fe;
    }
    .card-header h1 { font-size: 1.4rem; }
    .card-header p  { color: #c7d2fe; font-size: 0.85rem; margin-top: 5px; }

    #cb-messages {
      height: 340px; overflow-y: auto;
      padding: 16px; background: #f8fafc;
      display: flex; flex-direction: column; gap: 10px;
    }
    .cb-msg {
      max-width: 85%; padding: 11px 14px; border-radius: 14px;
      font-size: 0.88rem; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
    }
    .cb-msg.bot  { background: #fff; border: 1px solid #e2e8f0; align-self: flex-start; color: #1e293b; }
    .cb-msg.user { background: var(--primary); color: #fff; align-self: flex-end; }

    #cb-suggestions {
      padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 7px;
      background: #f1f5f9; border-top: 1px solid #e2e8f0;
    }
    .cb-chip {
      background: #e0e7ff; color: #4338ca; border: none; border-radius: 20px;
      padding: 6px 13px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
      transition: background .12s;
    }
    .cb-chip:hover { background: #c7d2fe; }

    #cb-input-row {
      display: flex; border-top: 1px solid #e2e8f0;
    }
    #cb-input {
      flex: 1; border: none; outline: none;
      padding: 15px 16px; font-size: 0.92rem;
    }
    #cb-send {
      background: var(--primary); color: #fff; border: none;
      padding: 0 20px; cursor: pointer; font-size: 1.15rem;
      transition: background .12s;
    }
    #cb-send:hover { background: #4338ca; }

    .links {
      text-align: center; margin-top: 22px;
      display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
    }
    .links a {
      color: #c7d2fe; text-decoration: none; font-size: 0.83rem;
      font-weight: 600; padding: 7px 14px; border-radius: 20px;
      border: 1px solid rgba(199,210,254,0.35);
      transition: background .12s;
    }
    .links a:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="avatar">👨‍💻</div>
      <h1>Ask Ishpreet Singh</h1>
      <p>AI Engineering Student · Python · LLMs · Cocokart Founder</p>
    </div>

    <div id="cb-messages"></div>

    <div id="cb-suggestions">
      <button class="cb-chip" onclick="sendChip('What projects has he built?')">Projects</button>
      <button class="cb-chip" onclick="sendChip('What are his skills?')">Skills</button>
      <button class="cb-chip" onclick="sendChip('Is he available for internship?')">Hire?</button>
      <button class="cb-chip" onclick="sendChip('Tell me about Cocokart')">Cocokart</button>
      <button class="cb-chip" onclick="sendChip('How can I contact him?')">Contact</button>
    </div>

    <div id="cb-input-row">
      <input id="cb-input" type="text" placeholder="Ask anything about Ishpreet..."
             onkeydown="if(event.key==='Enter') sendMessage()" />
      <button id="cb-send" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <div class="links">
    <a href="https://ishpreetsuri.github.io/code-ishpreet/portfolio/" target="_blank">Portfolio</a>
    <a href="https://github.com/ishpreetsuri" target="_blank">GitHub</a>
    <a href="https://www.linkedin.com/in/ishpreet-singh-a81920291" target="_blank">LinkedIn</a>
    <a href="mailto:ishpreet17suri@gmail.com">Email</a>
  </div>

  <script src="../chatbot/chatbot-data.js"></script>
  <script>
    // Inline minimal version of the chat logic (no floating widget needed here)
    function getAnswer(userMessage) {
      const msg = userMessage.toLowerCase().trim();
      let bestScore = 0;
      let bestAnswer = ISHPREET.fallback;
      ISHPREET.qa.forEach(entry => {
        let score = 0;
        entry.triggers.forEach(t => { if (msg.includes(t.toLowerCase())) score++; });
        if (score > bestScore) { bestScore = score; bestAnswer = entry.answer; }
      });
      return bestAnswer;
    }

    function addMessage(type, text) {
      const msgs = document.getElementById("cb-messages");
      const div = document.createElement("div");
      div.className = `cb-msg ${type}`;
      div.textContent = text;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("cb-input");
      const text = input.value.trim();
      if (!text) return;
      addMessage("user", text);
      input.value = "";
      setTimeout(() => addMessage("bot", getAnswer(text)), 400);
    }

    function sendChip(text) {
      document.getElementById("cb-input").value = text;
      sendMessage();
    }

    // Welcome message
    addMessage("bot", "Hi! 👋 I'm Ishpreet's assistant.\n\nAsk me about his skills, projects, education, or how to hire him. Tap a chip below or type your question!");
  </script>
</body>
</html>
